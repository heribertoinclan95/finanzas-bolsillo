<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Finanzas de Bolsillo</title>
<meta name="theme-color" content="#EDF0F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E151B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finanzas">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">Finanzas<small id="tabTitle">Inicio</small></div>
    <div class="monthnav" role="group" aria-label="Cambiar mes" hidden>
      <button id="prevM" aria-label="Mes anterior">‹</button>
      <span id="monthLbl">—</span>
      <button id="nextM" aria-label="Mes siguiente">›</button>
    </div>
  </header>
  <main id="main" class="view"></main>
  <p class="status" id="status"></p>
</div>

<button class="fab" id="fab" aria-label="Registrar movimiento">+</button>

<nav class="tabs" aria-label="Secciones">
  <div class="in" role="tablist">
    <button role="tab" data-tab="inicio" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>Inicio</button>
    <button role="tab" data-tab="movs" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Movimientos</button>
    <button role="tab" data-tab="analisis" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 3 5-7 4 4"/><path d="M3 21h18"/></svg>Análisis</button>
    <button role="tab" data-tab="mas" aria-selected="false"><svg viewBox="0 0 24 24"><circle class="f" cx="5" cy="12" r="1.9"/><circle class="f" cx="12" cy="12" r="1.9"/><circle class="f" cx="19" cy="12" r="1.9"/></svg><span>Más <span class="badge" id="pendBadge" hidden>0</span></span></button>
  </div>
</nav>

<div id="sheetHost"></div>
<div id="lockHost"></div>
<div class="toast" id="toast" hidden></div>

<!-- El service worker se registra desde app.js: la CSP de _headers no permite scripts en línea. -->
<script src="conciliacion.js"></script>
<script src="conciliacion-ui.js"></script>
<script src="app.js"></script>
</body>
</html>
