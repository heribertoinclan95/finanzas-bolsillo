<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Finanzas de Bolsillo</title>
<meta name="theme-color" content="#EDF0F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E151B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finanzas">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">Finanzas<small id="tabTitle">Resumen del mes</small></div>
    <div class="monthnav" role="group" aria-label="Cambiar mes">
      <button id="prevM" aria-label="Mes anterior">‹</button>
      <span id="monthLbl">—</span>
      <button id="nextM" aria-label="Mes siguiente">›</button>
    </div>
  </header>
  <main id="main" class="view"></main>
  <p class="status" id="status"></p>
</div>

<button class="fab" id="fab" aria-label="Registrar movimiento">+</button>

<nav class="tabs" aria-label="Secciones">
  <div class="in" role="tablist">
    <button role="tab" data-tab="mes" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Mes</button>
    <button role="tab" data-tab="movs" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Movimientos</button>
    <button role="tab" data-tab="hoja" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg><span>A la hoja <span class="badge" id="pendBadge" hidden>0</span></span></button>
  </div>
</nav>

<div id="sheetHost"></div>
<div class="toast" id="toast" hidden></div>

<script src="app.js"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
